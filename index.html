<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MLB Draft Big Board</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f5f7fa;
      color: #1f2933;
    }

    h1 {
      margin-bottom: 16px;
    }

    .board {
      max-width: 1300px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    .header, .row {
      display: grid;
      grid-template-columns: 60px 1.6fr 90px 1.4fr 60px 60px 80px;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
    }

    .header {
      background: #111827;
      color: white;
      font-weight: 600;
      font-size: 13px;
      text-transform: uppercase;
    }

    .row {
      border-bottom: 1px solid #e5e7eb;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .row:hover {
      background: #f0f4f8;
    }

    .cell {
      font-size: 14px;
    }

    .name {
      font-weight: 600;
    }

    .fv {
      font-weight: 700;
    }

    .details {
      grid-column: 1 / -1;
      background: #f9fafb;
      padding: 16px 24px 20px;
      display: none;
      font-size: 14px;
      border-bottom: 1px solid #e5e7eb;
    }

    .details.open {
      display: block;
    }

    .details h4 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .bio {
      margin-bottom: 12px;
      color: #374151;
    }

    .links a {
      display: inline-block;
      margin-right: 18px;
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .error {
      color: #dc2626;
      padding: 16px;
      background: #fee2e2;
      border-radius: 8px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

<h1>MLB Draft Big Board</h1>
<div id="error-container"></div>

<div class="board" id="board">
  <div class="header">
    <div>#</div>
    <div>Name</div>
    <div>Pos</div>
    <div>School</div>
    <div>Age</div>
    <div>FV</div>
    <div>Throws</div>
  </div>
</div>

<script>
  const SHEET_ID = "1o581SSiEJJCtwXkeBF-UQxrBnUfUrQgAVOsdcInzx0E";
  const SHEET_GID = "492241520";
  const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${SHEET_GID}`;

  fetch(SHEET_URL)
    .then(res => res.text())
    .then(text => {
      try {
        const lines = text.trim().split('\n');
        if (lines.length < 2) {
          showError("No data found in spreadsheet. Make sure it has at least one player row.");
          return;
        }

        // Parse CSV
        const players = [];
        for (let i = 1; i < lines.length; i++) {
          const values = parseCSVLine(lines[i]);
          if (values[1]) { // Check if name exists
            players.push({
              rank: values[0] || "",
              name: values[1] || "",
              position: values[2] || "",
              school: values[3] || "",
              fv: values[4] || "",
              age: values[5] || "",
              height: values[6] || "",
              weight: values[7] || "",
              bat_hand: values[8] || "",
              throw_hand: values[9] || "",
              report: values[10] || "",
              report_link: values[11] || "",
              analytics_link: values[12] || "",
              video_link: values[13] || "",
              stats_link: values[14] || ""
            });
          }
        }

        if (players.length === 0) {
          showError("No valid player data found. Check your spreadsheet format.");
          return;
        }

        renderBoard(players);
      } catch (err) {
        showError("Error parsing data: " + err.message);
        console.error(err);
      }
    })
    .catch(err => {
      showError("Failed to fetch data. Check your internet connection and sheet permissions.");
      console.error(err);
    });

  function parseCSVLine(line) {
    const result = [];
    let current = "";
    let insideQuotes = false;

    for (let i = 0; i < line.length; i++) {
      const char = line[i];
      if (char === '"') {
        insideQuotes = !insideQuotes;
      } else if (char === ',' && !insideQuotes) {
        result.push(current.trim());
        current = "";
      } else {
        current += char;
      }
    }
    result.push(current.trim());
    return result;
  }

  function showError(message) {
    const container = document.getElementById("error-container");
    container.innerHTML = `<div class="error">${message}</div>`;
  }

  function renderBoard(players) {
    const board = document.getElementById("board");

    players.forEach(player => {
      const row = document.createElement("div");
      row.className = "row";

      row.innerHTML = `
        <div class="cell">${player.rank || ""}</div>
        <div class="cell name">${player.name || ""}</div>
        <div class="cell">${player.position || ""}</div>
        <div class="cell">${player.school || ""}</div>
        <div class="cell">${player.age || ""}</div>
        <div class="cell fv">${player.fv || ""}</div>
        <div class="cell">${player.throw_hand || ""}</div>
      `;

      const details = document.createElement("div");
      details.className = "details";

      details.innerHTML = `
        <h4>Scouting Report</h4>
        <p>${player.report || "No report available"}</p>
        <div class="bio">
          <strong>Bio:</strong>
          ${[player.height, player.weight ? `${player.weight} lbs` : ""].filter(Boolean).join(" / ") || "N/A"} — Bats ${player.bat_hand || "N/A"}, Throws ${player.throw_hand || "N/A"}
        </div>
        <div class="links">
          ${player.report_link ? `<a href="${player.report_link}" target="_blank" rel="noopener noreferrer">Full Report</a>` : ""}
          ${player.analytics_link ? `<a href="${player.analytics_link}" target="_blank" rel="noopener noreferrer">Analytics</a>` : ""}
          ${player.video_link ? `<a href="${player.video_link}" target="_blank" rel="noopener noreferrer">Video</a>` : ""}
          ${player.stats_link ? `<a href="${player.stats_link}" target="_blank" rel="noopener noreferrer">Stats</a>` : ""}
        </div>
      `;

      row.addEventListener("click", () => {
        details.classList.toggle("open");
      });

      board.appendChild(row);
      board.appendChild(details);
    });
  }
</script>

</body>
</html>
