<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Andersen Pickard's 2026 MLB Draft Big Board</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f5f7fa;
      color: #1f2933;
    }

    h1 {
      margin-bottom: 16px;
    }

    .search-container {
      margin-bottom: 24px;
      max-width: 1300px;
      margin-left: auto;
      margin-right: auto;
    }

    .search-box {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      background: white;
      color: #1f2933;
      transition: border-color 0.15s ease;
    }

    #modalReportText {
      line-height: 1.6;
      max-height: 400px;
      overflow-y: auto;
      padding-right: 8px;
      margin-top: 0;
    }

    .search-box:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .search-box::placeholder {
      color: #9ca3af;
    }

    .board {
      max-width: 1300px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    .header, .row {
      display: grid;
      grid-template-columns: 50px 1.5fr 80px 1.3fr 50px 50px 70px 70px 70px 70px;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
    }

    .header {
      background: #111827;
      color: white;
      font-weight: 600;
      font-size: 13px;
      text-transform: uppercase;
    }

    .tools {
      margin-bottom: 12px;
      color: #374151;
      line-height: 1.5;
    }

    .tools strong {
      display: inline-block;
      margin-right: 8px;
      margin-bottom: 4px;
    }

    .tool-group {
      display: inline-block;
      margin-top: 4px;
    }
    
    .header > div {
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header > div:hover {
      opacity: 0.8;
    }

    .sort-indicator {
      font-size: 12px;
      opacity: 0.6;
    }

    .row {
      border-bottom: 1px solid #e5e7eb;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .row:hover {
      background: #f0f4f8;
    }

    .cell {
      font-size: 14px;
    }

    .name {
      font-weight: 600;
    }

    .fv {
      font-weight: 700;
    }

    .details {
      grid-column: 1 / -1;
      background: #f9fafb;
      padding: 16px 24px 20px;
      display: none;
      font-size: 14px;
      border-bottom: 1px solid #e5e7eb;
    }

    .details.open {
      display: block;
    }

    .details h4 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .bio {
      margin-bottom: 12px;
      color: #374151;
    }

    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .action-btn {
      background: #2563eb;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      transition: background 0.15s ease;
    }

    .action-btn:hover {
      background: #1d4ed8;
      text-decoration: none;
    }

    .action-btn.secondary {
      background: #6b7280;
    }

    .action-btn.secondary:hover {
      background: #4b5563;
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      align-items: center;
      justify-content: center;
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      background-color: white;
      padding: 32px;
      border-radius: 8px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 24px;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 28px;
      cursor: pointer;
      color: #666;
    }

    .close-btn:hover {
      color: #000;
    }

    /* PDF Modal Specific Styles */
    .pdf-modal-content {
      background-color: white;
      border-radius: 8px;
      max-width: 900px;
      width: 90%;
      max-height: 90vh;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }

    .pdf-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 32px;
      border-bottom: 1px solid #e5e7eb;
    }

    .error {
      color: #dc2626;
      padding: 16px;
      background: #fee2e2;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #2563eb;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    .no-results {
      text-align: center;
      padding: 40px;
      color: #6b7280;
      font-style: italic;
      grid-column: 1 / -1;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<h1>Andersen Pickard's 2026 MLB Draft Big Board</h1>

  <div class="social-links" style="
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
    max-width: 1300px;
    margin-left: auto;
    margin-right: auto;
">
  <a href="https://x.com/andersenpickard" 
     target="_blank" 
     rel="noopener noreferrer"
     style="
        background: #000;

     "
     onmouseover="this.style.background='#222'"

  </a>
  
  <a href="https://linkedin.com/in/andersenpickard" 
     target="_blank" 
     rel="noopener noreferrer"
     style="
        background: #0077b5;
        color: white;
        padding: 10px 20px;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 500;
        font-size: 14px;
        transition: background 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
     "
     onmouseover="this.style.background='#0066a1'"
     onmouseout="this.style.background='#0077b5'">

  </a>
  
  <a href="https://andersenpickard.wixsite.com/home" 
     target="_blank" 
     rel="noopener noreferrer"
     style="
        background: #2563eb;
        color: white;
        padding: 10px 20px;
        border-radius: 6px;
        text-decoration: none;
        font-weight: 500;
        font-size: 14px;
        transition: background 0.15s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
     "
     onmouseover="this.style.background='#1d4ed8'"
     onmouseout="this.style.background='#2563eb'">
    Portfolio
  </a>
</div>
  
<div class="search-container">
  <input 
    type="text" 
    id="searchBox" 
    class="search-box" 
    placeholder="Search players by name..." 
    autocomplete="off"
  />
</div>

<div id="error-container"></div>

<div class="board" id="board">
  <div class="header">
    <div data-sort="rank"># <span class="sort-indicator"></span></div>
    <div data-sort="name">Name <span class="sort-indicator"></span></div>
    <div data-sort="position">Pos <span class="sort-indicator"></span></div>
    <div data-sort="school">School <span class="sort-indicator"></span></div>
    <div data-sort="fv">FV <span class="sort-indicator"></span></div>
    <div data-sort="age">Age <span class="sort-indicator"></span></div>
    <div>Height</div>
    <div>Weight</div>
    <div>Bats</div>
    <div>Throws</div>
  </div>
  <div class="loading">
    <div class="spinner"></div>
    Loading the latest reports and data...
  </div>
</div>

<div id="reportModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalPlayerName"></h2>
      <button class="close-btn" onclick="closeReportModal()">&times;</button>
    </div>
    <p id="modalReportText"></p>
  </div>
</div>

<div id="pdfModal" class="modal">
  <div class="pdf-modal-content">
    <div class="pdf-modal-header">
      <h2 style="margin: 0;">Analytics Report</h2>
      <button class="close-btn" onclick="closePdfModal()">&times;</button>
    </div>
    <iframe id="pdfFrame" width="100%" height="600px" style="border: none;"></iframe>
  </div>
</div>

<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxPoECCo_lX-hwSa9bI8z2KcHVeeFa76m3dQeR9DVjdoxh1qkME0QIvJnNKSL9WwZZ-bQ/exec";

  let allPlayers = [];
  let sortState = {
    column: null,
    ascending: true
  };

  let searchTimeout;
  const searchBox = document.getElementById('searchBox');
  
  searchBox.addEventListener('input', function() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
      const searchTerm = this.value.toLowerCase().trim();
      filterAndDisplayPlayers(searchTerm);
    }, 300); 
  });

  searchBox.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      clearTimeout(searchTimeout);
      const searchTerm = this.value.toLowerCase().trim();
      filterAndDisplayPlayers(searchTerm);
    }
  });

  function filterAndDisplayPlayers(searchTerm) {
    if (!searchTerm) {
      clearBoard();
      renderPlayers(allPlayers);
      return;
    }

    const filteredPlayers = allPlayers.filter(player => {
      const playerName = (player.name || '').toLowerCase();
      return playerName.includes(searchTerm);
    });

    clearBoard();
    
    if (filteredPlayers.length === 0) {
      showNoResultsMessage(searchTerm);
    } else {
      renderPlayers(filteredPlayers);
    }
  }

  function showNoResultsMessage(searchTerm) {
    const board = document.getElementById("board");
    const noResults = document.createElement("div");
    noResults.className = "no-results";
    noResults.textContent = `No players found matching "${searchTerm}"`;
    board.appendChild(noResults);
  }

  function sortPlayers(players, column) {
    const newAscending = sortState.column === column ? !sortState.ascending : true;
    sortState.column = column;
    sortState.ascending = newAscending;

    const sorted = [...players].sort((a, b) => {
      let aVal = a[column];
      let bVal = b[column];

      if (column === 'rank' || column === 'fv' || column === 'age') {
        aVal = parseInt(aVal) || 999999;
        bVal = parseInt(bVal) || 999999;
        
        if (newAscending) {
          return aVal - bVal;
        } else {
          return bVal - aVal;
        }
      } else {
        aVal = (aVal || '').toString().toLowerCase().trim();
        bVal = (bVal || '').toString().toLowerCase().trim();
        
        if (newAscending) {
          return aVal.localeCompare(bVal);
        } else {
          return bVal.localeCompare(aVal);
        }
      }
    });

    console.log("Sorted by", column, "ascending:", newAscending);
    return sorted;
  }

  function updateSortIndicators() {
    document.querySelectorAll('.header > div').forEach(header => {
      const indicator = header.querySelector('.sort-indicator');
      if (!indicator) return;

      const column = header.getAttribute('data-sort');
      if (column === sortState.column) {
        indicator.textContent = sortState.ascending ? '▲' : '▼';
        indicator.style.opacity = '1';
      } else {
        indicator.textContent = '';
        indicator.style.opacity = '0.3';
      }
    });
  }

  fetch(APPS_SCRIPT_URL)
    .then(res => res.json())
    .then(players => {
      console.log("Loaded players:", players.length);
      if (players.length === 0) {
        showError("No player data found. Check your spreadsheet has data.");
        return;
      }
      allPlayers = players;
      renderBoard(players);
    })
    .catch(err => {
      showError("Failed to load data. Check your internet connection and Apps Script URL.");
      console.error(err);
    });

  function showError(message) {
    const container = document.getElementById("error-container");
    container.innerHTML = `<div class="error">${message}</div>`;
    const loading = document.querySelector(".loading");
    if (loading) loading.remove();
  }

  function openReportModal(playerName, reportText) {
    document.getElementById("modalPlayerName").textContent = playerName;
    
    let formattedText = reportText || "";
    formattedText = formattedText.replace(/\r\n|\r|\n/g, '\n\n');
    formattedText = formattedText.replace(/\n\n/g, '<br><br>');
    formattedText = formattedText.replace(/\n/g, '<br>');
    document.getElementById("modalReportText").innerHTML = formattedText;
    document.getElementById("reportModal").classList.add("open");
  }

  function closeReportModal() {
    document.getElementById("reportModal").classList.remove("open");
  }

  function openPdfModal(pdfUrl) {
    document.getElementById("pdfFrame").src = pdfUrl;
    document.getElementById("pdfModal").classList.add("open");
  }

  function closePdfModal() {
    document.getElementById("pdfModal").classList.remove("open");
    document.getElementById("pdfFrame").src = "";
  }

  function openLinkInNewTab(url) {
    window.open(url, '_blank', 'noopener,noreferrer');
  }

  window.onclick = function(event) {
    const reportModal = document.getElementById("reportModal");
    const pdfModal = document.getElementById("pdfModal");
    
    if (event.target === reportModal) {
      closeReportModal();
    }
    if (event.target === pdfModal) {
      closePdfModal();
    }
  }

  document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
      closeReportModal();
      closePdfModal();
    }
  });

  function renderBoard(players) {
    const board = document.getElementById("board");
    const loading = board.querySelector(".loading");
    if (loading) loading.remove();

    renderPlayers(players);

    setTimeout(() => {
      const headerDivs = document.querySelectorAll('.header > div[data-sort]');
      headerDivs.forEach(header => {
        header.addEventListener('click', () => {
          const column = header.getAttribute('data-sort');
          const sortedPlayers = sortPlayers(allPlayers, column);
          allPlayers = sortedPlayers;
          clearBoard();
          const currentSearch = document.getElementById('searchBox').value.toLowerCase().trim();
          if (currentSearch) {
            const filtered = sortedPlayers.filter(p => 
              (p.name || '').toLowerCase().includes(currentSearch)
            );
            renderPlayers(filtered);
          } else {
            renderPlayers(sortedPlayers);
          }
          updateSortIndicators();
        });
      });
      updateSortIndicators();
    }, 0);
  }

  function clearBoard() {
    const board = document.getElementById("board");
    const rows = board.querySelectorAll('.row, .details, .no-results');
    rows.forEach(row => row.remove());
  }

  function renderPlayers(players) {
    const board = document.getElementById("board");

    players.forEach(player => {
        const row = document.createElement("div");
        row.className = "row";

        row.innerHTML = `
        <div class="cell">${player.rank || ""}</div>
        <div class="cell name">${player.name || ""}</div>
        <div class="cell">${player.position || ""}</div>
        <div class="cell">${player.school || ""}</div>
        <div class="cell fv">${player.fv || ""}</div>
        <div class="cell">${player.age || ""}</div>
        <div class="cell">${player.height || ""}</div>
        <div class="cell">${player.weight || ""}</div>
        <div class="cell">${player.bat_hand || ""}</div>
        <div class="cell">${player.throw_hand || ""}</div>
      `;

        const details = document.createElement("div");
        details.className = "details";

        const actionButtons = [];

        if (player.full_report) {
            actionButtons.push(`<button class="action-btn" data-action="full-report">Click for full report</button>`);
        }

        if (player.analytics_link) {
            actionButtons.push(`<button class="action-btn secondary" data-action="analytics">Analytics</button>`);
        }

        if (player.video_link) {
            actionButtons.push(`<button class="action-btn secondary" data-action="video">Video</button>`);
        }

        if (player.report_link) {
            actionButtons.push(`<button class="action-btn secondary" data-action="full-report-link">Full Report Link</button>`);
        }

        if (player.stats_link) {
            actionButtons.push(`<button class="action-btn secondary" data-action="stats">Stats</button>`);
        }

        const tools = [];
        const toolLabels = {
            hit: 'Hit',
            pow: 'Power',
            fld: 'Field',
            arm: 'Arm',
            run: 'Run',
            fb: 'Fastball',
            sl: 'Slider',
            cb: 'Curveball',
            ch: 'Changeup',
            ctrl: 'Control'
        };

        const hittingTools = ['hit', 'pow', 'fld', 'arm', 'run'];
        const pitchingTools = ['fb', 'sl', 'cb', 'ch', 'ctrl'];

        const hasHittingTools = hittingTools.some(tool => player[tool] && player[tool].toString().trim() !== '');
        const hasPitchingTools = pitchingTools.some(tool => player[tool] && player[tool].toString().trim() !== '');

        let toolsHTML = '';

        if (hasHittingTools || hasPitchingTools) {
            toolsHTML = `
        <div class="tools">
          <strong>Tools:</strong><br>
      `;

            if (hasHittingTools) {
                const hittingToolItems = [];
                hittingTools.forEach(tool => {
                    if (player[tool] && player[tool].toString().trim() !== '') {
                        hittingToolItems.push(`${toolLabels[tool]}: ${player[tool]}`);
                    }
                });
                if (hittingToolItems.length > 0) {
                    toolsHTML += `<span class="tool-group">${hittingToolItems.join(' &nbsp;&nbsp; ')}</span>`;
                }
            }

            if (hasPitchingTools) {
                const pitchingToolItems = [];
                pitchingTools.forEach(tool => {
                    if (player[tool] && player[tool].toString().trim() !== '') {
                        pitchingToolItems.push(`${toolLabels[tool]}: ${player[tool]}`);
                    }
                });
                if (pitchingToolItems.length > 0) {
                    if (hasHittingTools) toolsHTML += '<br>';
                    toolsHTML += `<span class="tool-group">${pitchingToolItems.join(' &nbsp;&nbsp; ')}</span>`;
                }
            }

            toolsHTML += `</div>`;
        }

        details.innerHTML = `
        <h4>Strengths</h4>
        <p style="white-space: pre-wrap;">${player.report || "No strengths available"}</p>

        <h4>Weaknesses</h4>
        <p style="white-space: pre-wrap;">${player.weaknesses || "No weaknesses available"}</p>

        <div class="bio">
          <strong>Bio:</strong>
          ${[player.height, player.weight ? `${player.weight} lbs` : ""].filter(Boolean).join(" / ") || "N/A"} — Bats ${player.bat_hand || "N/A"}, Throws ${player.throw_hand || "N/A"}
        </div>
        
        ${toolsHTML}

        <div class="action-buttons">
          ${actionButtons.join('')}
        </div>
      `;

        row.addEventListener("click", () => {
            details.classList.toggle("open");
        });

        board.appendChild(row);
        board.appendChild(details);

        setTimeout(() => {
            const buttons = details.querySelectorAll('.action-btn');

            buttons.forEach(button => {
                button.addEventListener('click', (e) => {
                    e.stopPropagation(); 

                    const action = button.getAttribute('data-action');

                    switch (action) {
                        case 'full-report':
                            if (player.full_report) {
                                openReportModal(player.name, player.full_report);
                            }
                            break;

                        case 'analytics':
                            if (player.analytics_link) {
                                openPdfModal(player.analytics_link);
                            }
                            break;

                        case 'video':
                            if (player.video_link) {
                                const videoUrl = player.video_link.includes('youtube.com/embed/') ?
                                    player.video_link.replace('youtube.com/embed/', 'youtube.com/watch?v=') :
                                    player.video_link;
                                openLinkInNewTab(videoUrl);
                            }
                            break;

                        case 'full-report-link':
                            if (player.report_link) {
                                openLinkInNewTab(player.report_link);
                            }
                            break;

                        case 'stats':
                            if (player.stats_link) {
                                openLinkInNewTab(player.stats_link);
                            }
                            break;
                    }
                });
            });
        }, 0);
    });
}
</script>

</body>
</html>
