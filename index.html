<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Andersen Pickard's 2026 MLB Draft Big Board</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 20px 16px;
      background: #f5f7fa;
      color: #1f2933;
    }

    h1 {
      margin-bottom: 16px;
      font-size: clamp(24px, 5vw, 32px);
      text-align: center;
    }

    .search-container {
      margin-bottom: 20px;
      max-width: 1300px;
      margin-left: auto;
      margin-right: auto;
    }

    .search-box {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      background: white;
      color: #1f2933;
      transition: border-color 0.15s ease;
      box-sizing: border-box;
    }

    #modalReportText {
      white-space: pre-line;
      line-height: 1.6;
      max-height: 400px;
      overflow-y: auto;
      padding-right: 8px;
    }

    .search-box:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .search-box::placeholder {
      color: #9ca3af;
    }

    .board {
      max-width: 1300px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .board-table {
      width: 100%;
      min-width: 800px;
      border-collapse: collapse;
    }

    .board-table th,
    .board-table td {
      padding: 14px 12px;
      text-align: left;
      border-bottom: 1px solid #e5e7eb;
      vertical-align: middle;
    }

    .board-table th {
      background: #111827;
      color: white;
      font-weight: 600;
      font-size: 13px;
      text-transform: uppercase;
      position: sticky;
      top: 0;
      z-index: 10;
      white-space: nowrap;
    }

    .board-table th.sortable {
      cursor: pointer;
      user-select: none;
      transition: background-color 0.15s ease;
    }

    .board-table th.sortable:hover {
      background: #1f2937;
    }

    .sort-indicator {
      font-size: 10px;
      margin-left: 4px;
      opacity: 0.6;
    }

    .board-table tr {
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .board-table tr:hover {
      background: #f0f4f8;
    }

    .player-name {
      font-weight: 600;
      min-width: 150px;
    }

    .fv {
      font-weight: 700;
      color: #2563eb;
    }

    .position {
      min-width: 60px;
    }

    .school {
      min-width: 120px;
    }

    /* Mobile-optimized columns */
    @media (max-width: 768px) {
      .board-table th:nth-child(4), /* School column */
      .board-table td:nth-child(4) {
        display: none;
      }
      
      .board-table th:nth-child(7), /* Height */
      .board-table td:nth-child(7),
      .board-table th:nth-child(8), /* Weight */
      .board-table td:nth-child(8) {
        display: none;
      }
      
      .board {
        border-radius: 6px;
      }
      
      .board-table th,
      .board-table td {
        padding: 12px 8px;
        font-size: 13px;
      }
      
      .player-name {
        min-width: 120px;
      }
    }

    /* Very small screens */
    @media (max-width: 480px) {
      body {
        padding: 16px 12px;
      }
      
      .board-table th:nth-child(6), /* Age */
      .board-table td:nth-child(6),
      .board-table th:nth-child(9), /* Bats */
      .board-table td:nth-child(9),
      .board-table th:nth-child(10), /* Throws */
      .board-table td:nth-child(10) {
        display: none;
      }
      
      .board-table th,
      .board-table td {
        padding: 10px 6px;
        font-size: 12px;
      }
      
      .player-name {
        min-width: 100px;
      }
    }

    .details {
      background: #f9fafb;
      padding: 20px;
      display: none;
      font-size: 14px;
      border-bottom: 1px solid #e5e7eb;
      width: 100%;
      box-sizing: border-box;
    }

    .details.open {
      display: block;
    }

    .details h4 {
      margin-top: 0;
      margin-bottom: 12px;
      color: #111827;
      font-size: 16px;
    }

    .bio {
      margin-bottom: 16px;
      color: #374151;
      padding: 12px;
      background: white;
      border-radius: 6px;
      border-left: 4px solid #2563eb;
    }

    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .action-btn {
      background: #2563eb;
      color: white;
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
      text-decoration: none;
      display: inline-block;
      text-align: center;
      transition: all 0.15s ease;
      flex: 1;
      min-width: 140px;
    }

    .action-btn:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }

    .action-btn.secondary {
      background: #6b7280;
    }

    .action-btn.secondary:hover {
      background: #4b5563;
    }

    /* Mobile button adjustments */
    @media (max-width: 768px) {
      .action-buttons {
        flex-direction: column;
      }
      
      .action-btn {
        min-width: 100%;
        margin-bottom: 8px;
      }
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      background-color: white;
      padding: 24px;
      border-radius: 8px;
      max-width: 600px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }

    @media (max-width: 768px) {
      .modal-content {
        padding: 20px;
      }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 28px;
      cursor: pointer;
      color: #666;
      padding: 0;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-btn:hover {
      color: #000;
    }

    /* PDF Modal Specific Styles */
    .pdf-modal-content {
      background-color: white;
      border-radius: 8px;
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }

    .pdf-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      border-bottom: 1px solid #e5e7eb;
    }

    .error {
      color: #dc2626;
      padding: 16px;
      background: #fee2e2;
      border-radius: 8px;
      margin-bottom: 16px;
      text-align: center;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #2563eb;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    .no-results {
      text-align: center;
      padding: 40px;
      color: #6b7280;
      font-style: italic;
      background: white;
      border-radius: 8px;
      margin-top: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Social Links */
    .social-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
      max-width: 1300px;
      margin-left: auto;
      margin-right: auto;
      justify-content: center;
    }

    .social-link {
      background: #000;
      color: white;
      padding: 12px 20px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 120px;
      justify-content: center;
      text-align: center;
    }

    .social-link.twitter {
      background: #000;
    }
    
    .social-link.twitter:hover {
      background: #222;
    }
    
    .social-link.linkedin {
      background: #0077b5;
    }
    
    .social-link.linkedin:hover {
      background: #0066a1;
    }
    
    .social-link.portfolio {
      background: #2563eb;
    }
    
    .social-link.portfolio:hover {
      background: #1d4ed8;
    }

    @media (max-width: 768px) {
      .social-links {
        flex-direction: column;
      }
      
      .social-link {
        min-width: 100%;
      }
    }

    /* Mobile info hint */
    .mobile-hint {
      display: none;
      text-align: center;
      color: #6b7280;
      font-size: 12px;
      margin-top: 8px;
      padding: 8px;
      background: rgba(0,0,0,0.05);
      border-radius: 4px;
    }

    @media (max-width: 768px) {
      .mobile-hint {
        display: block;
      }
    }
  </style>
</head>
<body>

<h1>Andersen Pickard's 2026 MLB Draft Big Board</h1>

<div class="social-links">
  <a href="https://x.com/andersenpickard" 
     target="_blank" 
     rel="noopener noreferrer"
     class="social-link twitter">
    Twitter (X)
  </a>
  
  <a href="https://linkedin.com/in/andersenpickard" 
     target="_blank" 
     rel="noopener noreferrer"
     class="social-link linkedin">
    LinkedIn
  </a>
  
  <a href="https://andersenpickard.wixsite.com/home" 
     target="_blank" 
     rel="noopener noreferrer"
     class="social-link portfolio">
    Portfolio
  </a>
</div>
  
<div class="search-container">
  <input 
    type="text" 
    id="searchBox" 
    class="search-box" 
    placeholder="Search players by name..." 
    autocomplete="off"
  />
  <div class="mobile-hint">Swipe horizontally to see all columns</div>
</div>

<div id="error-container"></div>

<div class="board" id="board">
  <table class="board-table">
    <thead>
      <tr>
        <th class="sortable" data-sort="rank"># <span class="sort-indicator"></span></th>
        <th class="sortable" data-sort="name">Name <span class="sort-indicator"></span></th>
        <th class="sortable" data-sort="position">Pos <span class="sort-indicator"></span></th>
        <th class="sortable" data-sort="school">School <span class="sort-indicator"></span></th>
        <th class="sortable" data-sort="fv">FV <span class="sort-indicator"></span></th>
        <th class="sortable" data-sort="age">Age <span class="sort-indicator"></span></th>
        <th>Height</th>
        <th>Weight</th>
        <th>Bats</th>
        <th>Throws</th>
      </tr>
    </thead>
    <tbody id="board-body">
      <!-- Players will be inserted here -->
    </tbody>
  </table>
  <div class="loading">
    <div class="spinner"></div>
    Loading the latest reports and data...
  </div>
</div>

<div id="reportModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalPlayerName"></h2>
      <button class="close-btn" onclick="closeReportModal()">&times;</button>
    </div>
    <p id="modalReportText"></p>
  </div>
</div>

<div id="pdfModal" class="modal">
  <div class="pdf-modal-content">
    <div class="pdf-modal-header">
      <h2 style="margin: 0;">Analytics Report</h2>
      <button class="close-btn" onclick="closePdfModal()">&times;</button>
    </div>
    <iframe id="pdfFrame" width="100%" height="600px" style="border: none;"></iframe>
  </div>
</div>

<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxPoECCo_lX-hwSa9bI8z2KcHVeeFa76m3dQeR9DVjdoxh1qkME0QIvJnNKSL9WwZZ-bQ/exec";

  let allPlayers = [];
  let sortState = {
    column: null,
    ascending: true
  };

  // Search functionality
  let searchTimeout;
  const searchBox = document.getElementById('searchBox');
  
  searchBox.addEventListener('input', function() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
      const searchTerm = this.value.toLowerCase().trim();
      filterAndDisplayPlayers(searchTerm);
    }, 300);
  });

  searchBox.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      clearTimeout(searchTimeout);
      const searchTerm = this.value.toLowerCase().trim();
      filterAndDisplayPlayers(searchTerm);
    }
  });

  function filterAndDisplayPlayers(searchTerm) {
    const boardBody = document.getElementById("board-body");
    const board = document.getElementById("board");
    const loading = board.querySelector(".loading");
    
    if (loading) loading.remove();
    
    if (!searchTerm) {
      renderPlayers(allPlayers);
      return;
    }

    const filteredPlayers = allPlayers.filter(player => {
      const playerName = (player.name || '').toLowerCase();
      const playerSchool = (player.school || '').toLowerCase();
      const playerPosition = (player.position || '').toLowerCase();
      
      return playerName.includes(searchTerm) || 
             playerSchool.includes(searchTerm) || 
             playerPosition.includes(searchTerm);
    });

    boardBody.innerHTML = '';
    
    if (filteredPlayers.length === 0) {
      board.innerHTML = '<div class="no-results">No players found matching "' + searchTerm + '"</div>';
    } else {
      renderPlayers(filteredPlayers);
    }
  }

  function sortPlayers(players, column) {
    const newAscending = sortState.column === column ? !sortState.ascending : true;
    sortState.column = column;
    sortState.ascending = newAscending;

    const sorted = [...players].sort((a, b) => {
      let aVal = a[column];
      let bVal = b[column];

      if (column === 'rank' || column === 'fv' || column === 'age') {
        aVal = parseInt(aVal) || 999999;
        bVal = parseInt(bVal) || 999999;
        
        if (newAscending) {
          return aVal - bVal;
        } else {
          return bVal - aVal;
        }
      } else {
        aVal = (aVal || '').toString().toLowerCase().trim();
        bVal = (bVal || '').toString().toLowerCase().trim();
        
        if (newAscending) {
          return aVal.localeCompare(bVal);
        } else {
          return bVal.localeCompare(aVal);
        }
      }
    });

    updateSortIndicators();
    return sorted;
  }

  function updateSortIndicators() {
    document.querySelectorAll('.board-table th.sortable').forEach(header => {
      const indicator = header.querySelector('.sort-indicator');
      if (!indicator) return;

      const column = header.getAttribute('data-sort');
      if (column === sortState.column) {
        indicator.textContent = sortState.ascending ? '▲' : '▼';
        indicator.style.opacity = '1';
      } else {
        indicator.textContent = '';
        indicator.style.opacity = '0.3';
      }
    });
  }

  fetch(APPS_SCRIPT_URL)
    .then(res => res.json())
    .then(players => {
      console.log("Loaded players:", players.length);
      if (players.length === 0) {
        showError("No player data found. Check your spreadsheet has data.");
        return;
      }
      allPlayers = players;
      renderBoard(players);
    })
    .catch(err => {
      showError("Failed to load data. Check your internet connection and Apps Script URL.");
      console.error(err);
    });

  function showError(message) {
    const container = document.getElementById("error-container");
    container.innerHTML = `<div class="error">${message}</div>`;
    const loading = document.querySelector(".loading");
    if (loading) loading.remove();
  }

  function openReportModal(playerName, reportText) {
    document.getElementById("modalPlayerName").textContent = playerName;
    document.getElementById("modalReportText").textContent = reportText;
    document.getElementById("reportModal").classList.add("open");
  }

  function closeReportModal() {
    document.getElementById("reportModal").classList.remove("open");
  }

  function openPdfModal(pdfUrl) {
    document.getElementById("pdfFrame").src = pdfUrl;
    document.getElementById("pdfModal").classList.add("open");
  }

  function closePdfModal() {
    document.getElementById("pdfModal").classList.remove("open");
    document.getElementById("pdfFrame").src = "";
  }

  function openLinkInNewTab(url) {
    window.open(url, '_blank', 'noopener,noreferrer');
  }

  window.onclick = function(event) {
    const reportModal = document.getElementById("reportModal");
    const pdfModal = document.getElementById("pdfModal");
    
    if (event.target === reportModal) {
      closeReportModal();
    }
    if (event.target === pdfModal) {
      closePdfModal();
    }
  }

  document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
      closeReportModal();
      closePdfModal();
    }
  });

  function renderBoard(players) {
    const board = document.getElementById("board");
    const loading = board.querySelector(".loading");
    if (loading) loading.remove();

    renderPlayers(players);

    // Add header click listeners
    document.querySelectorAll('.board-table th.sortable').forEach(header => {
      header.addEventListener('click', () => {
        const column = header.getAttribute('data-sort');
        const sortedPlayers = sortPlayers(allPlayers, column);
        allPlayers = sortedPlayers;
        const currentSearch = document.getElementById('searchBox').value.toLowerCase().trim();
        
        const boardBody = document.getElementById("board-body");
        boardBody.innerHTML = '';
        
        if (currentSearch) {
          const filtered = sortedPlayers.filter(p => 
            (p.name || '').toLowerCase().includes(currentSearch) ||
            (p.school || '').toLowerCase().includes(currentSearch) ||
            (p.position || '').toLowerCase().includes(currentSearch)
          );
          renderPlayers(filtered);
        } else {
          renderPlayers(sortedPlayers);
        }
      });
    });
    
    updateSortIndicators();
  }

  function renderPlayers(players) {
    const boardBody = document.getElementById("board-body");
    if (!boardBody) return;
    
    boardBody.innerHTML = '';

    players.forEach(player => {
      const row = document.createElement("tr");
      row.dataset.playerId = player.id || player.name;
      
      row.innerHTML = `
        <td>${player.rank || ""}</td>
        <td class="player-name">${player.name || ""}</td>
        <td class="position">${player.position || ""}</td>
        <td class="school">${player.school || ""}</td>
        <td class="fv">${player.fv || ""}</td>
        <td>${player.age || ""}</td>
        <td>${player.height || ""}</td>
        <td>${player.weight || ""}</td>
        <td>${player.bat_hand || ""}</td>
        <td>${player.throw_hand || ""}</td>
      `;

      const detailsRow = document.createElement("tr");
      detailsRow.className = "details-row";
      const detailsCell = document.createElement("td");
      detailsCell.colSpan = 10;
      detailsCell.className = "details-cell";
      
      const details = document.createElement("div");
      details.className = "details";
      
      const actionButtons = [];
      
      if (player.full_report) {
        actionButtons.push(`<button class="action-btn" data-action="full-report">Full Report</button>`);
      }
      
      if (player.analytics_link) {
        actionButtons.push(`<button class="action-btn secondary" data-action="analytics">Analytics</button>`);
      }
      
      if (player.video_link) {
        actionButtons.push(`<button class="action-btn secondary" data-action="video">Video</button>`);
      }
      
      if (player.report_link) {
        actionButtons.push(`<button class="action-btn secondary" data-action="full-report-link">Report Link</button>`);
      }
      
      if (player.stats_link) {
        actionButtons.push(`<button class="action-btn secondary" data-action="stats">Stats</button>`);
      }

      details.innerHTML = `
        <h4>Scouting Summary</h4>
        <p>${player.report || "No report available"}</p>
        
        <div class="bio">
          <strong>Bio:</strong>
          ${[player.height, player.weight ? `${player.weight} lbs` : ""].filter(Boolean).join(" / ") || "N/A"} — Bats ${player.bat_hand || "N/A"}, Throws ${player.throw_hand || "N/A"}
        </div>

        <div class="action-buttons">
          ${actionButtons.join('')}
        </div>
      `;

      detailsCell.appendChild(details);
      detailsRow.appendChild(detailsCell);
      
      let isDetailsOpen = false;
      
      row.addEventListener("click", () => {
        if (isDetailsOpen) {
          details.classList.remove("open");
          detailsRow.style.display = 'none';
        } else {
          details.classList.add("open");
          detailsRow.style.display = 'table-row';
          
          // Close any other open details
          document.querySelectorAll('.details.open').forEach(openDetails => {
            if (openDetails !== details) {
              openDetails.classList.remove("open");
              openDetails.closest('.details-row').style.display = 'none';
            }
          });
        }
        isDetailsOpen = !isDetailsOpen;
      });

      boardBody.appendChild(row);
      boardBody.appendChild(detailsRow);
      
      // Set initial state
      detailsRow.style.display = 'none';

      // Add event listeners to buttons
      setTimeout(() => {
        const buttons = details.querySelectorAll('.action-btn');
        
        buttons.forEach(button => {
          button.addEventListener('click', (e) => {
            e.stopPropagation();
            
            const action = button.getAttribute('data-action');
            
            switch(action) {
              case 'full-report':
                if (player.full_report) {
                  openReportModal(player.name, player.full_report);
                }
                break;
                
              case 'analytics':
                if (player.analytics_link) {
                  openPdfModal(player.analytics_link);
                }
                break;
                
              case 'video':
                if (player.video_link) {
                  const videoUrl = player.video_link.includes('youtube.com/embed/') 
                    ? player.video_link.replace('youtube.com/embed/', 'youtube.com/watch?v=')
                    : player.video_link;
                  openLinkInNewTab(videoUrl);
                }
                break;
                
              case 'full-report-link':
                if (player.report_link) {
                  openLinkInNewTab(player.report_link);
                }
                break;
                
              case 'stats':
                if (player.stats_link) {
                  openLinkInNewTab(player.stats_link);
                }
                break;
            }
          });
        });
      }, 0);
    });
  }
</script>

</body>
</html>
