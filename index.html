<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MLB Draft Big Board</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f5f7fa;
      color: #1f2933;
    }

    h1 {
      margin-bottom: 16px;
    }

    .board {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    .header, .row {
      display: grid;
      grid-template-columns: 60px 80px 1.5fr 60px 1.2fr 90px 80px;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
    }

    .header {
      background: #111827;
      color: white;
      font-weight: 600;
      font-size: 14px;
      text-transform: uppercase;
    }

    .row {
      border-bottom: 1px solid #e5e7eb;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .row:hover {
      background: #f0f4f8;
    }

    .cell {
      font-size: 14px;
    }

    .name {
      font-weight: 600;
    }

    .details {
      grid-column: 1 / -1;
      background: #f9fafb;
      padding: 16px 24px;
      display: none;
      font-size: 14px;
    }

    .details.open {
      display: block;
    }

    .details h4 {
      margin-top: 0;
    }

    .links a {
      display: inline-block;
      margin-right: 16px;
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .fv {
      font-weight: 700;
    }
  </style>
</head>
<body>

<h1>MLB Draft Big Board</h1>

<div class="board" id="board">
  <div class="header">
    <div>#</div>
    <div>Pos</div>
    <div>Name</div>
    <div>Age</div>
    <div>School</div>
    <div>Throws</div>
    <div>FV</div>
  </div>
</div>

<script>
  const players = Array.from({ length: 100 }, (_, i) => ({
    rank: i + 1,
    position: "RHP",
    name: `Player ${i + 1}`,
    age: 20,
    school: "Example University",
    handedness: "R/R",
    fv: 50,
    report: "Well-rounded prospect with projectable frame. Shows average present tools with room for future growth. Needs refinement in approach and consistency but projects as a potential everyday contributor.",
    links: [
      { label: "Analytics Profile", url: "#" },
      { label: "Video", url: "#" },
      { label: "Stats", url: "#" }
    ]
  }));

  const board = document.getElementById("board");

  players.forEach(player => {
    const row = document.createElement("div");
    row.className = "row";

    row.innerHTML = `
      <div class="cell">${player.rank}</div>
      <div class="cell">${player.position}</div>
      <div class="cell name">${player.name}</div>
      <div class="cell">${player.age}</div>
      <div class="cell">${player.school}</div>
      <div class="cell">${player.handedness}</div>
      <div class="cell fv">${player.fv}</div>
    `;

    const details = document.createElement("div");
    details.className = "details";

    details.innerHTML = `
      <h4>Scouting Report</h4>
      <p>${player.report}</p>
      <div class="links">
        ${player.links.map(l => `<a href="${l.url}" target="_blank">${l.label}</a>`).join("")}
      </div>
    `;

    row.addEventListener("click", () => {
      details.classList.toggle("open");
    });

    board.appendChild(row);
    board.appendChild(details);
  });
</script>

</body>
</html>
