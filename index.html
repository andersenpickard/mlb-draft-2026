<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MLB Draft Big Board</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f5f7fa;
      color: #1f2933;
    }

    h1 {
      margin-bottom: 16px;
    }

    .board {
      max-width: 1300px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    .header, .row {
      display: grid;
      grid-template-columns: 60px 1.6fr 90px 1.4fr 60px 60px 80px;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
    }

    .header {
      background: #111827;
      color: white;
      font-weight: 600;
      font-size: 13px;
      text-transform: uppercase;
    }

    .row {
      border-bottom: 1px solid #e5e7eb;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .row:hover {
      background: #f0f4f8;
    }

    .cell {
      font-size: 14px;
    }

    .name {
      font-weight: 600;
    }

    .fv {
      font-weight: 700;
    }

    .details {
      grid-column: 1 / -1;
      background: #f9fafb;
      padding: 16px 24px 20px;
      display: none;
      font-size: 14px;
      border-bottom: 1px solid #e5e7eb;
    }

    .details.open {
      display: block;
    }

    .details h4 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .bio {
      margin-bottom: 12px;
      color: #374151;
    }

    .links a {
      display: inline-block;
      margin-right: 18px;
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .error {
      color: #dc2626;
      padding: 16px;
      background: #fee2e2;
      border-radius: 8px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

<h1>MLB Draft Big Board</h1>
<div id="error-container"></div>

<div class="board" id="board">
  <div class="header">
    <div>#</div>
    <div>Name</div>
    <div>Pos</div>
    <div>School</div>
    <div>Age</div>
    <div>FV</div>
    <div>Throws</div>
  </div>
</div>

<script>
  const SHEET_ID = "1o581SSiEJJCtwXkeBF-UQxrBnUfUrQgAVOsdcInzx0E";
  const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=492241520&tqx=out:json`;

  fetch(SHEET_URL)
    .then(res => res.text())
    .then(text => {
      try {
        // Handle Google Sheets API response format
        const json = JSON.parse(text.substring(47).slice(0, -2));
        const rows = json.table?.rows || [];

        if (rows.length === 0) {
          showError("No data found in spreadsheet. Check your Sheet ID and permissions.");
          return;
        }

        const players = rows.map(r => ({
          rank: r.c[0]?.v,
          name: r.c[1]?.v,
          position: r.c[2]?.v,
          school: r.c[3]?.v,
          fv: r.c[4]?.v,
          age: r.c[5]?.v,
          height: r.c[6]?.v,
          weight: r.c[7]?.v,
          bat_hand: r.c[8]?.v,
          throw_hand: r.c[9]?.v,
          report: r.c[10]?.v,
          report_link: r.c[11]?.v,
          analytics_link: r.c[12]?.v,
          video_link: r.c[13]?.v,
          stats_link: r.c[14]?.v
        }));

        renderBoard(players);
      } catch (err) {
        showError("Error parsing data: " + err.message);
      }
    })
    .catch(err => {
      showError("Failed to fetch data. Check your internet connection and sheet permissions.");
      console.error(err);
    });

  function showError(message) {
    const container = document.getElementById("error-container");
    container.innerHTML = `<div class="error">${message}</div>`;
  }

  function renderBoard(players) {
    const board = document.getElementById("board");

    players.forEach(player => {
      const row = document.createElement("div");
      row.className = "row";

      row.innerHTML = `
        <div class="cell">${player.rank || ""}</div>
        <div class="cell name">${player.name || ""}</div>
        <div class="cell">${player.position || ""}</div>
        <div class="cell">${player.school || ""}</div>
        <div class="cell">${player.age || ""}</div>
        <div class="cell fv">${player.fv || ""}</div>
        <div class="cell">${player.throw_hand || ""}</div>
      `;

      const details = document.createElement("div");
      details.className = "details";

      details.innerHTML = `
        <h4>Scouting Report</h4>
        <p>${player.report || "No report available"}</p>
        <div class="bio">
          <strong>Bio:</strong>
          ${[player.height, player.weight ? `${player.weight} lbs` : ""].filter(Boolean).join(" / ") || "N/A"} — Bats ${player.bat_hand || "N/A"}, Throws ${player.throw_hand || "N/A"}
        </div>
        <div class="links">
          ${player.report_link ? `<a href="${player.report_link}" target="_blank" rel="noopener noreferrer">Full Report</a>` : ""}
          ${player.analytics_link ? `<a href="${player.analytics_link}" target="_blank" rel="noopener noreferrer">Analytics</a>` : ""}
          ${player.video_link ? `<a href="${player.video_link}" target="_blank" rel="noopener noreferrer">Video</a>` : ""}
          ${player.stats_link ? `<a href="${player.stats_link}" target="_blank" rel="noopener noreferrer">Stats</a>` : ""}
        </div>
      `;

      row.addEventListener("click", () => {
        details.classList.toggle("open");
      });

      board.appendChild(row);
      board.appendChild(details);
    });
  }
</script>

</body>
</html>
