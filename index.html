<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MLB Draft Big Board</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 24px;
      background: #f5f7fa;
      color: #1f2933;
    }

    h1 {
      margin-bottom: 16px;
    }

    .board {
      max-width: 1300px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    .header, .row {
      display: grid;
      grid-template-columns: 60px 1.6fr 90px 1.4fr 60px 60px 80px;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
    }

    .header {
      background: #111827;
      color: white;
      font-weight: 600;
      font-size: 13px;
      text-transform: uppercase;
    }

    .row {
      border-bottom: 1px solid #e5e7eb;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .row:hover {
      background: #f0f4f8;
    }

    .cell {
      font-size: 14px;
    }

    .name {
      font-weight: 600;
    }

    .fv {
      font-weight: 700;
    }

    .details {
      grid-column: 1 / -1;
      background: #f9fafb;
      padding: 16px 24px 20px;
      display: none;
      font-size: 14px;
      border-bottom: 1px solid #e5e7eb;
    }

    .details.open {
      display: block;
    }

    .details h4 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .bio {
      margin-bottom: 12px;
      color: #374151;
    }

    .links a {
      display: inline-block;
      margin-right: 18px;
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .error {
      color: #dc2626;
      padding: 16px;
      background: #fee2e2;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #2563eb;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<h1>MLB Draft Big Board</h1>
<div id="error-container"></div>

<div class="board" id="board">
  <div class="header">
    <div>#</div>
    <div>Name</div>
    <div>Pos</div>
    <div>School</div>
    <div>Age</div>
    <div>FV</div>
    <div>Throws</div>
  </div>
  <div class="loading">
    <div class="spinner"></div>
    Loading your draft board...
  </div>
</div>

<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw-FXxG8fQKDWOkOr0qFffpsGu0jit-GuhErPpcoGnADlA_oPMBBRvL7xo_OW7QbA0dKQ/exec";

  fetch(APPS_SCRIPT_URL)
    .then(res => res.json())
    .then(players => {
      console.log("Loaded players:", players.length);
      console.log("First player:", players[0]);
      if (players.length === 0) {
        showError("No player data found. Check your spreadsheet has data.");
        return;
      }
      renderBoard(players);
    })
    .catch(err => {
      showError("Failed to load data. Check your internet connection and Apps Script URL.");
      console.error(err);
    });

  function showError(message) {
    const container = document.getElementById("error-container");
    container.innerHTML = `<div class="error">${message}</div>`;
    const loading = document.querySelector(".loading");
    if (loading) loading.remove();
  }

  function renderBoard(players) {
    const board = document.getElementById("board");
    const loading = board.querySelector(".loading");
    if (loading) loading.remove();

    players.forEach(player => {
      const row = document.createElement("div");
      row.className = "row";

      row.innerHTML = `
        <div class="cell">${player.rank || ""}</div>
        <div class="cell name">${player.name || ""}</div>
        <div class="cell">${player.position || ""}</div>
        <div class="cell">${player.school || ""}</div>
        <div class="cell">${player.age || ""}</div>
        <div class="cell fv">${player.fv || ""}</div>
        <div class="cell">${player.throw_hand || ""}</div>
      `;

      const details = document.createElement("div");
      details.className = "details";

      details.innerHTML = `
        <h4>Scouting Report</h4>
        <p>${player.report || "No report available"}</p>
        <div class="bio">
          <strong>Bio:</strong>
          ${[player.height, player.weight ? `${player.weight} lbs` : ""].filter(Boolean).join(" / ") || "N/A"} — Bats ${player.bat_hand || "N/A"}, Throws ${player.throw_hand || "N/A"}
        </div>
        <div class="links">
          ${player.report_link ? `<a href="${player.report_link}" target="_blank" rel="noopener noreferrer">Full Report</a>` : ""}
          ${player.analytics_link ? `<a href="${player.analytics_link}" target="_blank" rel="noopener noreferrer">Analytics</a>` : ""}
          ${player.video_link ? `<a href="${player.video_link}" target="_blank" rel="noopener noreferrer">Video</a>` : ""}
          ${player.stats_link ? `<a href="${player.stats_link}" target="_blank" rel="noopener noreferrer">Stats</a>` : ""}
        </div>
      `;

      row.addEventListener("click", () => {
        details.classList.toggle("open");
      });

      board.appendChild(row);
      board.appendChild(details);
    });
  }
</script>

</body>
</html>
